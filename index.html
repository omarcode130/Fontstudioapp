<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معالج الخطوط العربية - نسخة فعالة</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(120, 50, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 50, 120, 0.15) 0%, transparent 50%);
            animation: moveGradient 15s ease infinite;
            pointer-events: none;
        }

        @keyframes moveGradient {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(5%, 5%) rotate(180deg); }
        }

        .container {
            background: rgba(20, 20, 20, 0.9);
            backdrop-filter: blur(30px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            padding: 50px;
            max-width: 900px;
            width: 100%;
            z-index: 1;
        }

        h1 {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 40px;
            font-size: 1.1em;
        }

        .main-button {
            width: 100%;
            padding: 25px;
            font-size: 1.6em;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, rgba(120, 50, 255, 0.9), rgba(255, 50, 120, 0.9));
            border: none;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }

        .main-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(120, 50, 255, 0.6);
        }

        .upload-section {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .upload-section.show {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .upload-box {
            background: rgba(30, 30, 30, 0.8);
            border: 3px dashed rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 60px 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }

        .upload-box:hover {
            border-color: rgba(120, 50, 255, 0.8);
            background: rgba(40, 30, 50, 0.8);
        }

        .upload-icon {
            font-size: 5em;
            margin-bottom: 20px;
        }

        .upload-text {
            color: #fff;
            font-size: 1.3em;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .upload-subtext {
            color: rgba(255, 255, 255, 0.5);
        }

        input[type="file"] {
            display: none;
        }

        .options-grid {
            display: none;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .options-grid.show {
            display: grid;
        }

        .option-card {
            background: rgba(40, 40, 40, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 30px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            position: relative;
        }

        .option-card:hover {
            transform: translateY(-5px);
            border-color: rgba(120, 50, 255, 0.8);
        }

        .option-card.active {
            border-color: rgba(50, 255, 120, 1);
            background: rgba(50, 80, 50, 0.4);
            box-shadow: 0 0 30px rgba(50, 255, 120, 0.3);
        }

        .option-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .option-title {
            color: #fff;
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .option-desc {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9em;
        }

        .check-mark {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 30px;
            height: 30px;
            background: rgba(50, 255, 120, 1);
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: bold;
        }

        .option-card.active .check-mark {
            display: flex;
        }

        .process-button {
            width: 100%;
            padding: 20px;
            font-size: 1.4em;
            font-weight: bold;
            color: #000;
            background: linear-gradient(135deg, rgba(50, 255, 120, 1), rgba(50, 200, 255, 1));
            border: none;
            border-radius: 15px;
            cursor: pointer;
            margin-top: 30px;
            transition: all 0.3s ease;
            display: none;
        }

        .process-button.show {
            display: block;
        }

        .process-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(50, 255, 120, 0.5);
        }

        .loader {
            display: none;
            text-align: center;
            padding: 50px;
        }

        .loader.show {
            display: block;
        }

        .spinner {
            width: 70px;
            height: 70px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-top: 5px solid rgba(120, 50, 255, 1);
            border-radius: 50%;
            margin: 0 auto 25px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loader-text {
            color: #fff;
            font-size: 1.3em;
            font-weight: bold;
        }

        .success-message {
            display: none;
            text-align: center;
            padding: 40px;
            background: rgba(30, 60, 40, 0.5);
            border-radius: 20px;
            border: 2px solid rgba(50, 255, 120, 0.4);
        }

        .success-message.show {
            display: block;
        }

        .success-icon {
            font-size: 5em;
            margin-bottom: 20px;
        }

        .back-button {
            padding: 14px 35px;
            font-size: 1.1em;
            color: #fff;
            background: rgba(60, 60, 60, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 25px;
        }

        .back-button:hover {
            background: rgba(80, 80, 80, 0.8);
        }

        .file-name {
            color: rgba(50, 255, 120, 1);
            font-weight: bold;
            margin: 20px 0;
            padding: 18px;
            background: rgba(50, 255, 120, 0.15);
            border-radius: 12px;
            display: none;
        }

        .file-name.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ معالج الخطوط العربية</h1>
        <p class="subtitle">معالجة حقيقية للخطوط 🔥</p>

        <button class="main-button" id="mainBtn">🎨 تلاعب بخط</button>

        <div class="upload-section" id="uploadSection">
            <button class="back-button" id="backBtn">← رجوع</button>
            
            <div class="upload-box" id="uploadBox">
                <div class="upload-icon">📁</div>
                <div class="upload-text">اضغط هنا لرفع الخط</div>
                <div class="upload-subtext">TTF, OTF</div>
            </div>
            <input type="file" id="fontFile" accept=".ttf,.otf">
            
            <div id="fileName" class="file-name"></div>

            <div class="options-grid" id="optionsGrid">
                <div class="option-card" data-option="bold">
                    <div class="check-mark">✓</div>
                    <div class="option-icon">💪</div>
                    <div class="option-title">تعريض</div>
                    <div class="option-desc">زيادة سمك الخط</div>
                </div>

                <div class="option-card" data-option="extrabold">
                    <div class="check-mark">✓</div>
                    <div class="option-icon">🔥</div>
                    <div class="option-title">تعريض فائق</div>
                    <div class="option-desc">تعريض مضاعف</div>
                </div>

                <div class="option-card" data-option="outline">
                    <div class="check-mark">✓</div>
                    <div class="option-icon">⭕</div>
                    <div class="option-title">تفريغ</div>
                    <div class="option-desc">الحواف فقط</div>
                </div>

                <div class="option-card" data-option="thin">
                    <div class="check-mark">✓</div>
                    <div class="option-icon">📏</div>
                    <div class="option-title">تنحيف</div>
                    <div class="option-desc">خط نحيف</div>
                </div>

                <div class="option-card" data-option="embroidery">
                    <div class="check-mark">✓</div>
                    <div class="option-icon">🧵</div>
                    <div class="option-title">تطريز</div>
                    <div class="option-desc">خطوط داخلية</div>
                </div>

                <div class="option-card" data-option="shadow">
                    <div class="check-mark">✓</div>
                    <div class="option-icon">🌓</div>
                    <div class="option-title">ظل 3D</div>
                    <div class="option-desc">إضافة ظل</div>
                </div>
            </div>

            <button class="process-button" id="processBtn">
                ⚡ معالجة الخط الآن
            </button>
        </div>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <div class="loader-text">جاري المعالجة الفعلية... 🔥</div>
        </div>

        <div class="success-message" id="successMessage">
            <div class="success-icon">✅</div>
            <h2 style="color: #fff; margin-bottom: 20px;">تم بنجاح!</h2>
            <p style="color: rgba(255,255,255,0.8); margin-bottom: 20px;">
                تم تحميل الخط المعدل تلقائياً
            </p>
            <button class="back-button" id="resetBtn">🔄 معالجة خط آخر</button>
        </div>
    </div>

    <script>
        let currentFile = null;
        let selectedOptions = [];

        const mainBtn = document.getElementById('mainBtn');
        const uploadSection = document.getElementById('uploadSection');
        const uploadBox = document.getElementById('uploadBox');
        const fontFile = document.getElementById('fontFile');
        const fileName = document.getElementById('fileName');
        const optionsGrid = document.getElementById('optionsGrid');
        const processBtn = document.getElementById('processBtn');
        const loader = document.getElementById('loader');
        const successMessage = document.getElementById('successMessage');

        mainBtn.addEventListener('click', () => {
            mainBtn.style.display = 'none';
            uploadSection.classList.add('show');
        });

        uploadBox.addEventListener('click', () => fontFile.click());

        fontFile.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                currentFile = file;
                fileName.textContent = `📎 ${file.name}`;
                fileName.classList.add('show');
                optionsGrid.classList.add('show');
            }
        });

        document.querySelectorAll('.option-card').forEach(card => {
            card.addEventListener('click', () => {
                const option = card.dataset.option;
                card.classList.toggle('active');
                
                const index = selectedOptions.indexOf(option);
                if (index > -1) {
                    selectedOptions.splice(index, 1);
                } else {
                    selectedOptions.push(option);
                }

                processBtn.classList.toggle('show', selectedOptions.length > 0);
            });
        });

        processBtn.addEventListener('click', async () => {
            if (!currentFile || selectedOptions.length === 0) {
                alert('اختر خط وتأثير واحد على الأقل!');
                return;
            }

            uploadSection.classList.remove('show');
            loader.classList.add('show');

            const formData = new FormData();
            formData.append('font', currentFile);
            formData.append('options', selectedOptions.join(','));

            try {
                const response = await fetch('http://localhost:5000/process-font', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('فشلت المعالجة');

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `modified_${currentFile.name}`;
                a.click();
                URL.revokeObjectURL(url);

                loader.classList.remove('show');
                successMessage.classList.add('show');

            } catch (error) {
                alert('حدث خطأ: ' + error.message);
                loader.classList.remove('show');
                uploadSection.classList.add('show');
            }
        });

        function resetAll() {
            location.reload();
        }

        document.getElementById('backBtn').addEventListener('click', resetAll);
        document.getElementById('resetBtn').addEventListener('click', resetAll);
    </script>
</body>
</html>
